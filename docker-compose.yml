name: pihole

services:
  pihole:
    # Pinned, not `latest`: an upgrade is a deliberate version change, and a
    # surprise image swap cannot take DNS down for the whole network at 3am.
    image: pihole/pihole:${PIHOLE_VERSION:?Set PIHOLE_VERSION in .env (see .env.example)}
    container_name: pihole
    hostname: pihole
    restart: unless-stopped

    environment:
      TZ: ${TZ:-UTC}
      FTLCONF_webserver_api_password: ${WEBPASSWORD:?Set WEBPASSWORD in .env (see .env.example)}
      # Docker's bridge NAT makes LAN clients arrive as the docker gateway, so
      # FTL has to accept queries on any interface. This is the official
      # container guidance, not a shortcut around a restriction.
      FTLCONF_dns_listeningMode: ALL
      # DHCP lives in docker-compose.dhcp.yml so an unused DHCP server is not
      # exposed by default.
      FTLCONF_dhcp_active: "false"

    ports:
      - "${PIHOLE_DNS_PORT:-53}:53/tcp"
      - "${PIHOLE_DNS_PORT:-53}:53/udp"
      - "${PIHOLE_WEB_PORT:-80}:80/tcp"
      # Only used if you enable TLS in Pi-hole. Remove it if you do not.
      - "${PIHOLE_HTTPS_PORT:-443}:443/tcp"

    dns:
      - 127.0.0.1
      - 1.1.1.1

    volumes:
      - ./etc-pihole:/etc/pihole

    # FTL needs NET_ADMIN for its socket work and SYS_NICE for its scheduler;
    # the rest are the ownership/binding caps it drops to after start. Nothing
    # here grants new privileges, and no-new-privileges makes that enforced.
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - SYS_NICE
    security_opt:
      - no-new-privileges:true

    # Asks FTL itself, so an "up" container that cannot answer DNS is reported
    # unhealthy instead of masquerading as fine.
    healthcheck:
      test: ["CMD-SHELL", "dig +short +time=2 +tries=1 @127.0.0.1 pi.hole | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
